function hourly(f) {

    const prof = (m) => ((concert && HOUR_PROFILE_EARLY[m]) || HOUR_PROFILE[m])[h] || 0;

function layoutBars(days, orders, maxLanes = 3) {
  const first = days[0], last = days[days.length - 1];
  const items = orders.map((o) => {
    const s = o.orderDate, e = o.eta;
    if (diffDays(e, first) < 0 || diffDays(s, last) > 0) return null;
    return { o, si: Math.max(0, diffDays(s, first)), ei: Math.min(days.length - 1, diffDays(e, first)), startsHere: diffDays(s, first) >= 0, endsHere: diffDays(e, last) <= 0 };
  }).filter(Boolean).sort((a, b) => a.si - b.si || b.ei - b.si - (a.ei - a.si));
  const lanes = [], shown = [], hidden = [];
  items.forEach((it) => {
    let l = lanes.findIndex((end) => end < it.si);
    if (l === -1) { if (lanes.length < maxLanes) { lanes.push(it.ei); l = lanes.length - 1; } else { hidden.push(it); return; } } else lanes[l] = it.ei;
    shown.push({ ...it, lane: l });
  });
  return { shown, hidden, laneCount: lanes.length };
}

// A suggested order has not been placed yet: show its deadline, not an order date
const orderedText = (o, short) => (o.status === "suggested" ? `Order by ${short ? dowShort(o.orderDate) : fmtDate(o.orderDate)} ${o.cutoff}` : `Ordered ${short ? dowShort(o.orderDate) : fmtDate(o.orderDate)}`);
function OrderBar({ it, days, compact }) {
  const nav = useNav();
  const o = it.o, st = STATUS[o.status];
  const span = it.ei - it.si + 1;
  const g = o.status === "delayed" && o.origEta ? diffDays(o.origEta, days[0]) : null;
  const ghostPct = g !== null && g >= it.si && g <= it.ei ? ((g - it.si + 0.5) / span) * 100 : null;
  const label = `${o.supplier.name}, ${st.label}. ${orderedText(o)}, arrives ${fmtDate(o.eta)}.${o.origEta ? " Originally " + fmtDate(o.origEta) + "." : ""}${o.late ? " Arrives after it is needed." : ""}`;
  return html`
    <button type="button" onClick=${() => nav.openPanel("order", o.id)} aria-label=${label} title=${label}
      className=${cls("obar", "st-" + o.status, compact && "obar-sm", !it.startsHere && "cap-l", !it.endsHere && "cap-r")}
      style=${{ gridColumn: `${it.si + 1} / ${it.ei + 2}`, gridRow: it.lane + 1 }}>
      ${it.startsHere && html`<span className="dot"></span>`}
      <span className="t">${o.supplier.name}</span>
      ${span >= (compact ? 3 : 2) && html`<span className="inline-flex items-center gap-1 font-medium opacity-95"><${Icon} name=${st.icon} size=${14} sw=${2.2} />${span >= 3 && !(o.late && span < 5) ? st.label : ""}</span>`}
      ${o.late && html`<span className="inline-flex items-center gap-1 font-semibold"><${Icon} name="alert" size=${14} sw=${2.2} />${span >= 5 ? `Arrives ${dowShort(o.eta)}, needed ${dowShort(o.needed)}` : ""}</span>`}

    </button>`;
}

function MonthView({ anchor, layers, orders }) {
  const nav = useNav(), S = useStore();
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const start = addDays(first, -((first.getDay() + 6) % 7));
  const last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
  const weeks = [];
  for (let w = 0; w < 6; w++) { const days = Array.from({ length: 7 }, (_, i) => addDays(start, w * 7 + i)); if (days[0] > last) break; weeks.push(days); }
  const all = weeks.flat();
  const tots = all.map((d) => fcDay(d).total);
  const min = Math.min(...tots), max = Math.max(...tots);
  const lvl = (t) => Math.min(4, Math.floor(((t - min) / Math.max(1, max - min)) * 5));
  const heads = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  return html`
    <div className="hidden md:block">
      <div className="grid grid-cols-7 mb-1.5">${heads.map((x) => html`<div key=${x} className="text-center text-sm text-muted font-medium">${x}</div>`)}</div>
      <div className="grid gap-2">
        ${weeks.map((days, wi) => html`
          <div key=${wi} className="rounded-[14px] border border-line bg-surface p-1.5">
            <div className="grid grid-cols-7 gap-1.5">
              ${days.map((d) => {

                return html`
                  <button key=${dayKey(d)} type="button" title=${desc} aria-label=${desc} onClick=${() => nav.openPanel("day", off(d))}
                    className=${cls("mcell", "lvl" + level, !inM && "out", today && "today")}>
                    <span className="flex items-start justify-between w-full"><span className="num">${d.getDate()}</span>
                      <span className="flex items-center gap-1">
                        ${evs.length > 0 && html`<span className="edot" title=${evs.map((e) => e.name).join(", ")}></span>`}
                        ${hol && html`<${Icon} name="flag" size=${14} />`}
                        ${layers.groups && f.group && html`<${Icon} name="heart" size=${14} />`}
                        ${mk.deadlines.length > 0 && html`<${Icon} name="clock" size=${14} />`}
                        ${mk.risks.length > 0 && html`<${Icon} name="alert" size=${14} />`}

                      ${layers.weather && f.weather.kind !== "none" ? html`<${WeatherIcon} w=${f.weather} size=${18} />` : html`<span></span>`}
                      ${layers.numbers && html`<span className="text-[12px] font-semibold">${f.total}</span>`}
                    </span>

              })}
            </div>
            ${layers.orders && html`<div className="mt-1.5"><${BarRow} days=${days} orders=${orders} compact />${""}</div>`}
          </div>`)}

}

const StoreCtx = createContext(null);
const useStore = () => useContext(StoreCtx);
function StoreProvider({ children }) {
  const [state, setState] = useState(initialState);
  const [toast, setToast] = useState(null);
  const [dataVer, setDataVer] = useState(0);
  const refreshData = useCallback(() => setDataVer((v) => v + 1), []);
  const say = (msg) => setToast({ msg, id: Math.random() });
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 4200); return () => clearTimeout(t); }, [toast]);
  const mods = useMemo(() => ({ overrides: state.overrides, removed: state.removed, added: state.added, waste: state.waste }), [state.overrides, state.removed, state.added, state.waste]);
  const suggested = useMemo(() => suggestOrders(state.batches, state.orders, state.dismissed, mods), [state.batches, state.orders, state.dismissed, mods, dataVer]);
  const summary = useMemo(() => stockSummary(state.batches, state.orders, suggested), [state.batches, state.orders, suggested]);
  const orders = useMemo(() => [...state.orders, ...suggested].map(orderView), [state.orders, suggested]);
  const metrics = useMemo(() => computeMetrics({ state, suggested }), [state, suggested]);
  const mkOrder = (sug, id) => ({ id, sup: sug.sup, lines: sug.lines.map((l) => ({ p: l.p, qty: l.qty, ...(l.override ? { override: l.override } : {}), ...(l.manual ? { manual: true } : {}) })), orderOff: 0, etaOff: sug.etaOff, needOff: sug.needOff, status: "placed", fromSug: true, reason: sug.reason });

  const api = useMemo(() => ({
    receive({ lines, pOff, orderId }) {
      setState((s) => {
        let seq = s.seq;
        const nb = lines.filter((l) => l.qty > 0).map((l) => ({ id: "b" + seq++, p: l.p, qty: l.qty, pOff, eOff: l.eOff }));
        return { ...s, seq, batches: [...s.batches, ...nb], orders: s.orders.map((o) => (o.id === orderId ? { ...o, status: "delivered", etaOff: o.etaOff > 0 ? 0 : o.etaOff, origEtaOff: null } : o)) };
      });
      say(orderId ? "Delivery received. The new batches are in your stock." : "Delivery added to your stock.");
    },
    logWaste({ p, qty, cat, reason }) {
      setState((s) => {
        let left = qty;
        const batches = s.batches.slice().sort((a, b) => a.eOff - b.eOff).map((b) => {
          if (b.p !== p || left <= 0) return b;
          const t = Math.min(b.qty, left); left -= t; return { ...b, qty: b.qty - t };
        }).filter((b) => b.qty > 1e-9);
        return { ...s, seq: s.seq + 1, batches, waste: [{ id: "w" + s.seq, p, qty, cat, reason: reason || "", dOff: 0 }, ...s.waste] };
      });
      say("Waste logged. The next order for this item will take it into account.");
    },
    placeOrder(sug) {
      setState((s) => { const added = { ...s.added }; delete added[sug.sup]; return { ...s, added, seq: s.seq + 1, orders: [...s.orders, mkOrder(sug, "o" + s.seq)] }; });
      say(`Order placed with ${SUPPLIERS[sug.sup].name}. It now shows in your calendar.`);
    },
    placeAll(list) {
      setState((s) => { let seq = s.seq; const add = list.map((sug) => mkOrder(sug, "o" + seq++)); const added = { ...s.added }; list.forEach((x) => delete added[x.sup]); return { ...s, added, seq, orders: [...s.orders, ...add] }; });
      say(`${list.length} ${plural(list.length, "order")} placed.`);
    },
    dismiss(sup) { setState((s) => ({ ...s, dismissed: [...s.dismissed, sup] })); say("Suggestion set aside."); },
    restoreDismissed(sup) { setState((s) => ({ ...s, dismissed: s.dismissed.filter((x) => x !== sup) })); },
    saveOrder(v, editingId) {
      setState((s) => {
        if (editingId && !editingId.startsWith("sug-")) return { ...s, orders: s.orders.map((o) => (o.id === editingId ? { ...o, ...v } : o)) };
        return { ...s, seq: s.seq + 1, dismissed: editingId ? [...s.dismissed, editingId.replace("sug-", "")] : s.dismissed, orders: [...s.orders, { id: "o" + s.seq, status: "placed", reason: v.reason || "Added by you.", ...v }] };
      });
      say(editingId && !editingId.startsWith("sug-") ? "Order updated." : "Order saved. It now shows in your calendar.");
    },
    cancelOrder(id) { setState((s) => ({ ...s, orders: s.orders.map((o) => (o.id === id ? { ...o, status: "cancelled", reason: "Cancelled by you." } : o)) })); say("Order cancelled."); },
    markDelayed(id, newEtaOff) { setState((s) => ({ ...s, orders: s.orders.map((o) => (o.id === id ? { ...o, status: "delayed", origEtaOff: o.origEtaOff != null ? o.origEtaOff : o.etaOff, etaOff: newEtaOff, reason: "You marked this delivery as delayed." } : o)) })); say("Marked as delayed. The calendar shows the new date."); },
    setShift(empId, dow, code) { setState((s) => ({ ...s, rota: { ...s.rota, [empId]: s.rota[empId].map((c, i) => (i === dow ? code : c)) } })); },
    override(sup, pid, qty, reason) {
      setState((s) => ({ ...s, overrides: { ...s.overrides, [overrideKey(sup, pid)]: { qty, reason, by: HOTEL.manager } }, removed: Object.fromEntries(Object.entries(s.removed).filter(([k]) => k !== overrideKey(sup, pid))) }));
      say(`Your quantity is saved: ${fmtQty(PBY[pid], qty)} ${PBY[pid].name.toLowerCase()}. The reason is kept with the order.`);
    },
    clearOverride(sup, pid) { setState((s) => { const o = { ...s.overrides }; delete o[overrideKey(sup, pid)]; return { ...s, overrides: o }; }); say("Back to the recommended quantity."); },
    removeLine(sup, pid, reason) { setState((s) => ({ ...s, removed: { ...s.removed, [overrideKey(sup, pid)]: reason || "Removed by manager" } })); say(`${PBY[pid].name} removed from this order.`); },
    restoreLine(sup, pid) { setState((s) => { const r = { ...s.removed }; delete r[overrideKey(sup, pid)]; return { ...s, removed: r }; }); },
    addLine(sup, pid, qty) { setState((s) => ({ ...s, added: { ...s.added, [sup]: [...(s.added[sup] || []).filter((x) => x.p !== pid), { p: pid, qty }] } })); say(`${PBY[pid].name} added to the ${SUPPLIERS[sup].name.toLowerCase()} order.`); },
    addSpecial(s2) { setState((s) => ({ ...s, specials: [...s.specials, s2] })); say(`Added to ${s2.when}'s specials: ${s2.text}`); },
    say,
  }), []);
  const value = useMemo(() => ({ state, suggested, summary, orders, metrics, toast, dataVer, refreshData, ...api }), [state, suggested, summary, orders, metrics, toast, dataVer, refreshData, api]);
  return html`<${StoreCtx.Provider} value=${value}>${children}<//>`;
}

function PipelineStrip({ date }) {
  const f = fcDay(date), ing = ingDay(date);
  const kg = PRODUCTS.reduce((s, p) => s + useOnDay(p, date) * (p.kg || 0), 0);
  const nIng = Object.keys(ing.byIng).length;
  const nDish = new Set(MEALS.flatMap((m) => Object.keys(ing.menus[m].dishes))).size;
  const S = useStore();
  const nl = S.suggested.reduce((s, o) => s + o.lines.length, 0);
  const lines = `${nl} lines, ${S.suggested.length} POs`;
  const steps = [["calendar", "Bookings", `${f.rooms} rooms, ${f.guests} guests`], ["users", "Covers", `${f.total} meals + ${f.barGuests} bar`], ["plate", "Menu", `${nDish} dishes`], ["leaf", "Ingredients", `${nIng} items, ${Math.round(kg)} kg`], ["box", "Stock", "checked batch by batch"], ["clipboard", "Order", lines]];
  return html`<ol className="list-none p-0 m-0 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2" aria-label="How this day is calculated">
    ${steps.map(([ic, t, s], i) => html`<li key=${t} className="card-flat px-3 py-2.5 flex items-center gap-2.5 min-w-0"><span className="w-8 h-8 rounded-full bg-sage text-forest flex items-center justify-center shrink-0"><${Icon} name=${ic} size=${17} /></span><span className="min-w-0"><span className="block font-semibold text-[14px] leading-tight">${t}</span><span className="block text-[12.5px] text-muted leading-tight truncate">${s}</span></span></li>`)}
  </ol>`;
}

function dayDeliveries(S, d) { return S.orders.filter((o) => sameDay(o.eta, d) && o.status !== "cancelled" && o.status !== "suggested"); }
function dayDeadlines(S, d) { return S.suggested.filter((o) => o.deadlineOff === off(d)); }

function EventPanel({ id, onClose }) {
  const nav = useNav(), S = useStore();
  const e = [...EVENTS, ...HOLIDAYS].find((x) => x.id === id);
  if (!e) return null;
  const f1 = forecastDay(e.date), f0 = forecastDay(e.date, { noEvents: true });
  const extra = PRODUCTS.map((p) => {
    const tot = useOnDay(p, e.date);
    const ev = Object.entries(e.effect).reduce((s, [m, v]) => s + ((ingDay(e.date).byIng[p.id] || { bySvc: {} }).bySvc[m] || 0) * (v / (1 + v)), 0);
    return { p, q: ev };
  }).filter((x) => x.q > 0.4).sort((a, b) => b.q * b.p.price - a.q * a.p.price).slice(0, 4);

  return html`

/* =====================================================================
   SCREENS 1 and 2: TODAY (decision first) and DEMAND (covers, menu, ingredients)
   ===================================================================== */
function buildAttention(S, nav) {
  const cards = [];
  const rows = S.summary;
  const del = S.orders.find((o) => o.status === "delayed");
  if (del) {
    const risk = rows.filter((r) => del.lines.some((l) => l.p === r.p.id) && r.pr.firstShort !== null && r.pr.firstShort < del.etaOff).sort((a, b) => a.pr.firstShort - b.pr.firstShort)[0];
    const late = del.origEta ? diffDays(del.eta, del.origEta) : 0;
    cards.push({ id: "delay", tone: "amber", icon: "clock", title: `${del.supplier.name} delivery is ${late} ${plural(late, "day")} late`, text: `Now due ${dayWord(del.eta)}.` + (risk ? ` ${risk.p.name} may run short ${dayWord(addDays(TODAY, risk.pr.firstShort))}.` : ""), action: "See in calendar", run: () => nav.go("calendar", { view: "week", orderId: del.id }) });
  }
  const uf = rows.filter((r) => r.useFirst), ex = rows.filter((r) => r.expired.length);
  if (uf.length || ex.length) {
    const names = uf.map((r) => r.p.name.toLowerCase()).join(", ");
    cards.push({ id: "use", tone: ex.length ? "urgent" : "amber", icon: ex.length ? "alert" : "leaf", title: uf.length ? `${uf.length} ${plural(uf.length, "item")} to use within 48 hours` : `${ex.length} ${plural(ex.length, "item")} past use-by date`, text: (uf.length ? `${cap(names)}. ${uf[0].p.idea}.` : "") + (ex.length ? ` ${ex[0].p.name} has a batch past its use-by date. Please set it aside and log it.` : ""), action: "See what to use first", run: () => nav.go("stock", { filter: "use" }) });
  }
  const sug = S.suggested.slice().sort((a, b) => a.deadlineOff - b.deadlineOff)[0];
  if (sug) cards.push({ id: "order", tone: sug.late ? "amber" : "terra", icon: "clipboard", title: `Order ${SUPPLIERS[sug.sup].name.toLowerCase()} ${sug.deadlineOff === 0 ? "today by " + sug.cutoff : "by " + dowShort(addDays(TODAY, sug.deadlineOff)) + " " + sug.cutoff}`, text: sug.reason, action: "Review the order", run: () => nav.go("purchasing") });
  const risky = rows.filter((r) => r.riskWith !== null).sort((a, b) => a.riskWith - b.riskWith)[0];
  if (risky) cards.push({ id: "risk", tone: "urgent", icon: "alert", title: `${risky.p.name} may run short ${dayWord(addDays(TODAY, risky.riskWith))}`, text: `Even with today's recommended order there is a gap before the next delivery. Check the supplier timing.`, action: "Open stock", run: () => nav.go("stock", { filter: "risk" }) });
  const due = S.orders.filter((o) => sameDay(o.eta, TODAY) && ["placed", "confirmed", "ontheway"].includes(o.status));
  if (due.length) cards.push({ id: "due", tone: "info", icon: "truck", title: `${due.length} ${plural(due.length, "delivery", "deliveries")} due today`, text: `${due.map((o) => o.supplier.name).join(" and ")}. Check items against the delivery note, then add them to stock.`, action: "Receive delivery", run: () => nav.openModal("receive", { orderId: due[0].id }) });
  const g = GROUPS.find((x) => off(x.arrive) >= 0 && off(x.arrive) <= 6);
  if (g) cards.push({ id: "group", tone: "info", icon: "heart", title: `${g.name} arrives ${dayWord(g.arrive)}: ${g.guests} guests`, text: g.extras.filter((x) => off(x.date) >= 0).map((x) => `${x.covers} ${x.meal} covers ${dowName(x.date)} at ${x.time}`).join(", ") + ". Set menu choices and dietary needs are already in the forecast.", action: "See the day", run: () => nav.openPanel("day", off(g.arrive)) });
  const tg = teamGaps(S.state.rota);
  const gp = tg.gaps[0];
  if (gp) cards.push({ id: "team", tone: "info", icon: "users", title: `${gp.n} extra ${plural(gp.n, "pair")} of hands needed ${dowName(gp.date)} ${PERIOD_SHORT[gp.period]}`, text: `The ${gp.roleLabel} team looks stretched. The Team screen shows who could help.`, action: "Plan the team", run: () => nav.go("team", { dayOff: off(gp.date) }) });
  return cards;
}

// Share of a service's covers seated at the same time, at its busiest moment
const FLOOR_PEAK = { breakfast: { share: 0.45, at: "08:30" }, lunch: { share: 0.8, at: "13:00" }, dinner: { share: 0.75, at: "20:00" }, bar: { share: 0.6, at: "21:30" } };
function terraceFor(f, m) {
  const w = f.weather || {};
  const fair = w.kind === "sunny" || w.kind === "partly";
  const warm = (w.hi || 0) >= 18;
  const open = fair && (m === "breakfast" || m === "lunch" || warm);
  return { open, why: open ? `${w.label || "Fair"}, ${w.hi}°` : !fair ? `${w.label || "Weather"} expected` : `Too cool in the evening (${w.hi}° by day)` };
}
function floorPlan(f, m) {
  const x = f.meals[m], pk = FLOOR_PEAK[m], ter = terraceFor(f, m);
  const ev = m === "bar" ? 0 : x.eventCovers || 0, rs = x.roomService || 0;
  const parties = [];
  for (let r = ev; r > 0; r -= 6) parties.push({ size: Math.min(6, r), kind: "event" });
  for (let r = Math.round(Math.max(0, x.hotel - ev - rs) * pk.share); r > 0;) { const n = r === 3 ? 3 : Math.min(2, r); parties.push({ size: n, kind: "hotel" }); r -= n; }
  const cyc = [2, 4, 2, 3];
  for (let r = Math.round(x.walkIn * pk.share), i = 0; r > 0; i++) { const n = Math.min(cyc[i % 4], r); parties.push({ size: n, kind: "walk" }); r -= n; }
  const zones = [m === "bar" ? "bar" : "dining", ...(ter.open ? ["terrace"] : [])];
  const tables = FLOOR_TABLES.filter((t) => zones.includes(t.z));
  const seat = {};
  let waiting = 0;
  parties.sort((a, b) => (b.kind === "event") - (a.kind === "event") || b.size - a.size);
  parties.forEach((p) => {
    const t = tables.filter((t) => !seat[t.n] && t.s >= p.size).sort((a, b) => a.s - b.s || zones.indexOf(a.z) - zones.indexOf(b.z))[0];
    if (t) seat[t.n] = p; else waiting += p.size;
  });
  const seated = Object.values(seat).reduce((a, p) => a + p.size, 0);
  const seats = tables.reduce((a, t) => a + t.s, 0);

}

function statusChips(r) {
  const c = [];
  if (r.expired.length) c.push({ tone: "urgent", icon: "alert", t: "Expired" });
  if (r.riskWith !== null) c.push({ tone: "urgent", icon: "alert", t: `Short ${dayWordShort(addDays(TODAY, r.riskWith))}` });
  else if (r.orderSoon) c.push({ tone: "amber", icon: "clipboard", t: r.riskWithout !== null ? "Order to avoid a shortage" : "Order soon" });
  if (r.useFirst) c.push({ tone: "amber", icon: "leaf", t: "Use first" });
  if (r.plenty) c.push({ tone: "info", icon: "box", t: "Plenty in stock" });
  if (!c.length) c.push({ tone: "ok", icon: "check", t: "All good" });
  return c;
}
function suggestionLines(r) {
  const p = r.p, out = [];
  if (r.expired.length) out.push({ tone: "urgent", text: "Set the expired batch aside and log it as waste." });
  const l = r.sug ? r.sug.lines.find((x) => x.p === p.id) : null;
  const by = l ? `by ${r.sug.deadlineOff === 0 ? "today" : dowShort(addDays(TODAY, r.sug.deadlineOff))} ${r.sug.cutoff}` : "";
  if (l && r.wasteRisk && r.pr.firstShort !== null) {
    // Part of today's stock passes its date before it is used, and the item still runs out later: one message that explains both
    const keep = useOverDays(p, TODAY, r.pr.firstShort), short = addDays(TODAY, r.pr.firstShort); // what stock and open orders cover before the gap
    out.push({ tone: "amber", text: `${fmtQty(p, keep)} usable until ${dayWordShort(addDays(short, -1))}; short from ${dayWordShort(short)}: order ${fmtQty(p, l.qty)} ${by} for ${dowShort(addDays(TODAY, r.sug.etaOff))} delivery and use the oldest batch first. About ${eur(r.pr.wasteValue)} of today's stock passes its date before it is needed${p.idea ? ": " + p.idea.charAt(0).toLowerCase() + p.idea.slice(1) : ""}.` });
  } else {
    if (r.wasteRisk) out.push({ tone: "amber", text: `May go unused (about ${eur(r.pr.wasteValue)}).${p.idea ? " " + p.idea + "." : ""}` });
    else if (r.useFirst && p.idea) out.push({ tone: "amber", text: p.idea });
    if (l) out.push({ tone: r.sug.late ? "amber" : "terra", text: `Order ${fmtQty(p, l.qty)} ${by} (${SUPPLIERS[p.sup].name}, delivery ${dowShort(addDays(TODAY, r.sug.etaOff))}).` });
  }
  if (r.riskWith !== null) {
    const inc = r.incoming.filter((o) => o.etaOff > r.riskWith).sort((a, b) => a.etaOff - b.etaOff)[0];
    out.push({ tone: "urgent", text: `Runs short ${dayWordShort(addDays(TODAY, r.riskWith))}, before any new order can arrive (next ${SUPPLIERS[p.sup].name.toLowerCase()} delivery ${dowShort(addDays(TODAY, r.line.dd))}).${inc ? ` Ask for the ${STATUS[inc.status].label.toLowerCase()} order due ${dowShort(addDays(TODAY, inc.etaOff))} to come earlier, or buy a little locally.` : " Buy a little locally to bridge the gap."}` });
  }
  if (r.plenty) out.push({ tone: "info", text: "Reduce next order." });
  if (!out.length) out.push({ tone: "none", text: "No action needed." });

function StockScreen({ intent }) {

  const [filter, setFilter] = useState((intent && intent.filter) || "all");
  const rows = S.summary;
  const uf = rows.filter((r) => r.useFirst);
  const plenty = rows.filter((r) => r.plenty);
  const risk = rows.filter((r) => r.riskWithout !== null);
  const show = rows.filter((r) => (filter === "all" ? true : filter === "use" ? r.useFirst || r.expired.length : filter === "risk" ? r.riskWithout !== null || r.riskWith !== null || r.wasteRisk : r.orderSoon));
  const chips = [["all", "All"], ["use", "Use first"], ["order", "Order soon"], ["risk", "At risk"]];
  const batchRows = (r) => (r.batches.length ? r.batches : [null]);
  const m = S.metrics;
  return html`
    <div>
      <div className="flex flex-wrap items-end justify-between gap-3 mb-4">
        <div><h2 className="font-serif text-[30px] text-head m-0 leading-tight">Stock, looking ahead</h2><p className="mt-1 mb-0 text-muted">Every batch, oldest first, projected against the forecast for the next 7 days.</p></div>
        <div className="flex flex-wrap gap-2.5">
          <button type="button" className="btn btn-primary" onClick=${() => nav.openModal("receive", {})}><${Icon} name="truck" size=${18} />Receive a delivery</button>
          <button type="button" className="btn btn-secondary" onClick=${() => nav.openModal("waste", {})}><${Icon} name="trash" size=${18} />Log waste</button>
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <${MetricTile} icon="alert" label="Need an order to avoid a shortage" value=${risk.length} sub=${risk.length ? risk.slice(0, 2).map((r) => r.p.name.toLowerCase()).join(", ") : "nothing this week"} />
        <${MetricTile} icon="leaf" label="Use within 48 hours" value=${uf.length} sub=${uf.length ? uf.slice(0, 2).map((r) => r.p.name.toLowerCase()).join(", ") : "nothing"} />
        <${MetricTile} icon="box" label="Days on hand" value=${NUMBER_FMT(m.daysOnHand, 1)} sub="at the current pace" />
        <${MetricTile} icon="coin" label="Cash tied up" value=${eur(m.stockValue)} sub="at purchase price" />
      </div>
      ${uf.length > 0 && html`
        <div className="rounded-[16px] bg-[#fbebc8] border border-[#e2bd6b] p-4 mb-5 text-[#5c3b07]">
          <div className="flex items-center gap-2 font-semibold text-[18px]"><${Icon} name="leaf" size=${22} />${uf.length} ${plural(uf.length, "item")} to use within 48 hours</div>
          <ul className="list-none p-0 mt-3 mb-0 grid gap-2 md:grid-cols-3">
            ${uf.slice(0, 5).map((r) => html`<li key=${r.p.id} className="bg-white/60 rounded-xl p-3 text-[15px]"><span className="font-semibold">${r.p.name}, ${fmtQty(r.p, r.exp48)}.</span> ${r.p.idea}.
              <span className="block mt-2 flex flex-wrap gap-2"><button type="button" className="btn btn-secondary btn-sm !min-h-[36px]" onClick=${() => S.addSpecial({ when: "tomorrow", text: r.p.name.toLowerCase() + " special" })}>Use in tomorrow's special</button></span></li>`)}
            ${plenty.length > 0 && html`<li className="bg-white/60 rounded-xl p-3 text-[15px]"><span className="font-semibold">Reduce next order.</span> You have plenty of ${plenty.map((r) => r.p.name.toLowerCase()).join(", ")}.</li>`}
          </ul>
        </div>`}
      <div className="flex flex-wrap items-center gap-2 mb-4" role="group" aria-label="Filter stock">
        ${chips.map(([k, l]) => html`<button key=${k} type="button" aria-pressed=${filter === k} onClick=${() => setFilter(k)} className=${cls("filter-chip", filter === k && "on")}>${filter === k && html`<${Icon} name="check" size=${16} sw=${2.4} />`}${l}</button>`)}
      </div>
      ${show.length === 0 && html`<div className="card p-6 text-center"><p className="m-0">Nothing to show here. Nice work.</p></div>`}

      <div className="hidden lg:block overflow-x-auto card" tabIndex="0" role="region" aria-label="Stock table, scrolls sideways on small screens">
        <table className="tbl w-full min-w-[1100px]">
          <thead><tr><th>Product</th><th className="num">Quantity</th><th>Use by</th><th>Days left</th><th className="num">Use 3 / 7 days</th><th>Next 7 days (with order)</th><th>Incoming</th><th>Status</th><th>Suggestion</th></tr></thead>
          <tbody>
            ${CATEGORIES.map((cat) => {
              const rs = show.filter((r) => r.p.cat === cat);
              if (!rs.length) return null;
              return html`<${Fragment} key=${cat}>
                <tr className="cat-row"><th colSpan="9" scope="colgroup">${cat}</th></tr>
                ${rs.map((r) => {
                  const bs = batchRows(r);
                  return bs.map((b, i) => html`
                    <tr key=${r.p.id + i} className=${i === 0 ? "first-batch" : ""}>
                      ${i === 0 && html`<th scope="row" rowSpan=${bs.length} className="text-left align-top font-semibold">${r.p.name}</th>`}
                      <td className="num">${b ? fmtQty(r.p, b.qty) : "0"}</td>
                      <td>${b ? fmtDate(b.expiry, { day: "numeric", month: "short" }) : "-"}</td>
                      <td>${b ? html`<${DaysLeft} d=${b.daysLeft} />` : "-"}</td>
                      ${i === 0 && html`<td rowSpan=${bs.length} className="num align-top">${fq(r.p, r.use3)} / ${fq(r.p, r.use7)}</td>`}
                      ${i === 0 && html`<td rowSpan=${bs.length} className="align-top"><${MiniStock} r=${r} /></td>`}
                      ${i === 0 && html`<td rowSpan=${bs.length} className="align-top text-[14px]">${r.incQty > 0 ? html`<span className="font-semibold">${fmtQty(r.p, r.incQty)}</span><span className="block text-muted">${dowShort(addDays(TODAY, r.nextEta))}</span>` : html`<span className="text-muted">None</span>`}</td>`}
                      ${i === 0 && html`<td rowSpan=${bs.length} className="align-top"><div className="flex flex-col items-start gap-1.5">${statusChips(r).map((c) => html`<${Chip} key=${c.t} tone=${c.tone} icon=${c.icon}>${c.t}<//>`)}</div></td>`}
                      ${i === 0 && html`<td rowSpan=${bs.length} className="align-top max-w-[300px]"><div className="grid gap-1.5 text-[14.5px]">${suggestionLines(r).map((s, k) => html`<span key=${k} className=${cls("sug", "sug-" + s.tone)}>${s.text}</span>`)}</div></td>`}
                    </tr>`);
                })}
              <//>`;
            })}
          </tbody>
        </table>
      </div>

      <div className="lg:hidden grid gap-3">
        ${CATEGORIES.map((cat) => {
          const rs = show.filter((r) => r.p.cat === cat);
          if (!rs.length) return null;
          return html`<div key=${cat}><h3 className="font-serif text-[20px] text-head mt-3 mb-2">${cat}</h3>
            <div className="grid gap-3">${rs.map((r) => html`
              <article key=${r.p.id} className="card p-4">
                <div className="flex flex-wrap items-start justify-between gap-2"><h4 className="m-0 text-[18px] font-semibold">${r.p.name}</h4><div className="flex flex-wrap gap-1.5">${statusChips(r).map((c) => html`<${Chip} key=${c.t} tone=${c.tone} icon=${c.icon}>${c.t}<//>`)}</div></div>
                <ul className="list-none p-0 mt-3 mb-0 grid gap-2">${batchRows(r).map((b, i) => b && html`<li key=${i} className="flex flex-wrap items-center justify-between gap-2 text-[15px] border-t border-line pt-2"><span><span className="font-semibold">${fmtQty(r.p, b.qty)}</span><br/><span className="text-muted">${r.p.perish ? "Use by" : "Best before"}</span> ${fmtDate(b.expiry, { day: "numeric", month: "short" })}</span><${DaysLeft} d=${b.daysLeft} /></li>`)}</ul>
                <div className="flex items-center justify-between gap-3 mt-3"><p className="text-[14.5px] m-0"><span className="text-muted">Use 3 / 7 days:</span> <span className="font-semibold tnum">${fq(r.p, r.use3)} / ${fq(r.p, r.use7)}</span></p><${MiniStock} r=${r} /></div>
                <div className="grid gap-1.5 text-[14.5px] mt-2">${suggestionLines(r).map((s, k) => html`<span key=${k} className=${cls("sug", "sug-" + s.tone)}>${s.text}</span>`)}</div>
              </article>`)}</div></div>`;
        })}
      </div>
      <p className="text-sm text-muted mt-5 mb-0 flex gap-2 items-start"><${Icon} name="shield" size=${18} cls="mt-0.5" />Dates come from supplier labels entered by your team. This does not replace your food safety checks.</p>
    </div>`;
}

/* ---------- Purchasing ---------- */
const OVERRIDE_REASONS = ["Stock count differs", "Supplier minimum", "Event not in the forecast", "Menu change", "Price offer", "Other"];

function POLine({ o, l }) {
  const S = useStore(), nav = useNav();
  const p = PBY[l.p], L = o.details[l.p];
  const [edit, setEdit] = useState(false);
  const [qty, setQty] = useState(String(l.qty));
  const [reason, setReason] = useState(OVERRIDE_REASONS[0]);
  const [rmOpen, setRmOpen] = useState(false);
  const [rmReason, setRmReason] = useState("Already have it");
  const changed = l.override || (l.qty !== l.rec && !l.manual);
  const save = () => { const q = Number(qty); if (!(q >= 0)) return; if (q === l.rec) S.clearOverride(o.sup, l.p); else S.override(o.sup, l.p, q, reason); setEdit(false); };
  const risk = L.firstShort !== null && L.firstShort < L.dd;
  return html`
    <li className="grid gap-2 py-3.5 border-t border-line first:border-t-0">
      <div className="grid gap-x-4 gap-y-2 md:grid-cols-[1.4fr_.9fr_.9fr_1.5fr] items-start">
        <div className="min-w-0">
          <button type="button" onClick=${() => nav.openPanel("explain", { pid: l.p })} className="bg-transparent border-0 p-0 cursor-pointer text-left font-semibold text-[16.5px] text-ink hover:underline">${p.name}</button>
          <div className="flex flex-wrap gap-1.5 mt-1">
            ${risk && html`<${Chip} tone="urgent" icon="alert">Short ${dayWordShort(addDays(TODAY, L.firstShort))}<//>`}
            ${L.wasteLevel === "high" && html`<span title="If demand comes in at the low end of the range, part of this order could pass its date before it is used."><${Chip} tone="amber" icon="leaf">May expire if demand is low<//></span>`}
            ${l.override && html`<${Chip} tone="info" icon="edit">Your change: ${l.override.reason}<//>`}
            ${l.manual && html`<${Chip} tone="neutral" icon="plus">Added by you<//>`}
          </div>
        </div>
        <div className="tnum"><div className="text-[12.5px] text-muted">Recommended</div><div className="font-semibold text-[16.5px]">${fmtQty(p, l.rec)}</div><div className="text-[12.5px] text-muted" title="Middle half of likely outcomes (P25 to P75). The Explain panel shows P10 to P90.">likely ${rangeText(fq(p, L.range50[0]), fq(p, L.range50[1]))}</div></div>
        <div className="tnum"><div className="text-[12.5px] text-muted">Your order</div><div className=${cls("font-semibold text-[16.5px]", changed && "text-terra")}>${fmtQty(p, l.qty)}</div><div className="text-[12.5px] text-muted">${eur1(l.qty * p.price)}</div></div>
        <div className="text-[14px] text-muted">${fmtQty(p, L.forecast)} forecast ${L.win > 1 ? "from " : "on "}${winText(L)}, ${fmtQty(p, L.usable)} usable stock, ${fmtQty(p, L.buffer)} buffer, case ${p.step} ${p.unit}.</div>
      </div>
      <div className="flex flex-wrap gap-2">
        <button type="button" className="btn btn-secondary btn-sm" onClick=${() => nav.openPanel("explain", { pid: l.p })}><${Icon} name="info" size=${15} />Explain</button>
        <button type="button" className="btn btn-secondary btn-sm" onClick=${() => { setEdit(!edit); setRmOpen(false); setQty(String(l.qty)); }} aria-expanded=${edit}><${Icon} name="edit" size=${15} />Modify</button>
        <button type="button" className="btn btn-quiet btn-sm" onClick=${() => { setRmOpen(!rmOpen); setEdit(false); }} aria-expanded=${rmOpen}><${Icon} name="trash" size=${15} />Remove</button>
        ${(l.override || l.manual) && html`<button type="button" className="btn btn-quiet btn-sm" onClick=${() => (l.manual ? S.removeLine(o.sup, l.p, "Manual line removed") : S.clearOverride(o.sup, l.p))}><${Icon} name="undo" size=${15} />${l.manual ? "Undo" : "Use recommended"}</button>`}
      </div>
      ${edit && html`<div className="rounded-xl border border-line bg-cream p-3 grid sm:grid-cols-[120px_1fr_auto] gap-3 items-end">
        <label className="block"><span className="block text-[13.5px] font-semibold mb-1">Quantity (${p.unit})</span><input id=${"q-" + o.sup + l.p} type="number" min="0" step=${p.step >= 1 ? p.step : "any"} className="field" value=${qty} onInput=${(e) => setQty(e.target.value)} data-autofocus /></label>
        <label className="block"><span className="block text-[13.5px] font-semibold mb-1">Reason (kept with the order)</span><select id=${"r-" + o.sup + l.p} className="field" value=${reason} onChange=${(e) => setReason(e.target.value)}>${OVERRIDE_REASONS.map((r) => html`<option key=${r}>${r}</option>`)}</select></label>
        <div className="flex gap-2"><button type="button" className="btn btn-dark btn-sm" onClick=${save}>Save</button><button type="button" className="btn btn-secondary btn-sm" onClick=${() => setEdit(false)}>Cancel</button></div>
      </div>`}
      ${rmOpen && html`<div className="rounded-xl border border-line bg-cream p-3 flex flex-wrap gap-3 items-end">
        <label className="block flex-1 min-w-[200px]"><span className="block text-[13.5px] font-semibold mb-1">Why remove it?</span><select id=${"rm-" + o.sup + l.p} className="field" value=${rmReason} onChange=${(e) => setRmReason(e.target.value)}>${["Already have it", "Menu change", "Supplier cannot deliver", "Buying elsewhere", "Other"].map((r) => html`<option key=${r}>${r}</option>`)}</select></label>
        <div className="flex gap-2"><button type="button" className="btn btn-danger btn-sm" onClick=${() => S.removeLine(o.sup, l.p, rmReason)}>Remove from order</button><button type="button" className="btn btn-secondary btn-sm" onClick=${() => setRmOpen(false)}>Cancel</button></div>
      </div>`}
    </li>`;
}

function POCard({ o }) {
  const S = useStore(), nav = useNav();
  const sup = SUPPLIERS[o.sup];
  const total = o.lines.reduce((s, l) => s + l.qty * PBY[l.p].price, 0);
  const remKeys = Object.keys((S.state.mods && S.state.mods.removed) || S.state.removed || {});
  const free = PRODUCTS.filter((p) => p.sup === o.sup && !o.lines.some((l) => l.p === p.id) && !remKeys.includes(o.sup + ":" + p.id));
  const [addP, setAddP] = useState("");
  const removed = Object.entries(S.state.removed).filter(([k]) => k.startsWith(o.sup + ":"));
  const dl = o.deadlineOff;
  return html`
    <article className="card overflow-hidden" aria-label=${`Purchase order, ${sup.name}`}>
      <header className="px-5 py-4 bg-sage flex flex-wrap items-start justify-between gap-3">
        <div className="min-w-0">
          <h3 className="font-serif text-[22px] text-head m-0">${sup.name}</h3>
          <p className="m-0 mt-1 text-[14.5px] text-muted">Order by <span className="font-semibold text-ink">${dl === 0 ? "today" : dowShort(addDays(TODAY, dl))} ${o.cutoff}</span>, delivery <span className="font-semibold text-ink">${dowShort(addDays(TODAY, o.etaOff))} ${fmtDate(addDays(TODAY, o.etaOff), { day: "numeric", month: "short" })}</span>, lead time ${sup.lead} ${plural(sup.lead, "day")}.</p>
        </div>
        <div className="flex flex-wrap items-center gap-2"><${Chip} tone=${o.confidence === "stockout risk" ? "urgent" : o.confidence === "waste risk" ? "amber" : "ok"} icon=${o.confidence === "balanced" ? "check" : "alert"}>${{ "stockout risk": "Shortage risk", "waste risk": "Some may expire if demand is low", balanced: "Balanced" }[o.confidence]}<//><span className="font-serif text-[22px] text-head tnum">${eur(total)}</span></div>
      </header>
      <div className="px-5 py-2">
        <p className="m-0 mt-2 text-[14.5px] text-muted">${o.reason}</p>
        <ul className="list-none p-0 m-0">${o.lines.map((l) => html`<${POLine} key=${l.p} o=${o} l=${l} />`)}</ul>
        ${removed.length > 0 && html`<div className="border-t border-line py-3 text-[14.5px]"><span className="text-muted">Removed: </span>${removed.map(([k, why]) => { const pid = k.split(":")[1]; return html`<span key=${k} className="inline-flex items-center gap-1.5 mr-3">${PBY[pid].name} (${why}) <button type="button" className="btn btn-quiet btn-sm !min-h-[32px]" onClick=${() => S.restoreLine(o.sup, pid)}>Restore</button></span>`; })}</div>`}
      </div>
      <footer className="px-5 py-4 border-t border-line flex flex-wrap items-center gap-3">
        <button type="button" className="btn btn-primary" onClick=${() => S.placeOrder(o)}><${Icon} name="check" size=${18} />Accept and place order</button>
        ${free.length > 0 && html`<div className="flex items-center gap-2"><label className="sr-only" for=${"add-" + o.sup}>Add an item</label><select id=${"add-" + o.sup} className="field !w-auto !min-h-[40px]" value=${addP} onChange=${(e) => setAddP(e.target.value)}><option value="">Add an item...</option>${free.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select><button type="button" className="btn btn-secondary btn-sm" disabled=${!addP} onClick=${() => { if (addP) { S.addLine(o.sup, addP, PBY[addP].step); setAddP(""); } }}><${Icon} name="plus" size=${15} />Add</button></div>`}
        <button type="button" className="btn btn-quiet ml-auto" onClick=${() => S.dismiss(o.sup)}>Not now</button>
      </footer>
    </article>`;
}

  const total = sug.reduce((s, o) => s + o.lines.reduce((a, l) => a + l.qty * PBY[l.p].price, 0), 0);
  const placed = S.orders.filter((o) => ["placed", "confirmed", "ontheway", "delayed"].includes(o.status)).sort((a, b) => a.etaOff - b.etaOff);

        <div className="flex flex-wrap gap-2.5">

          <button type="button" className="btn btn-secondary" onClick=${() => nav.openModal("order", {})}><${Icon} name="plus" size=${18} />New order</button>

      <section className="mb-8" aria-label="Suggested purchase orders">

        ${sug.length ? html`<div className="grid gap-4">${sug.map((o) => html`<${POCard} key=${o.sup} o=${o} />`)}</div>` : html`<div className="card p-6 text-muted">No suggestions right now. Your stock and open orders cover the forecast.</div>`}
        ${S.state.dismissed.length > 0 && html`<p className="mt-3 mb-0 text-[14.5px] text-muted">Set aside: ${S.state.dismissed.map((s) => html`<button key=${s} type="button" className="btn btn-quiet btn-sm" onClick=${() => S.restoreDismissed(s)}>${SUPPLIERS[s].name} (bring back)</button>`)}</p>`}

      <section className="mb-2"><h3 className="font-serif text-[22px] text-head mt-0 mb-3">Delivered and closed <span className="text-muted text-[16px] font-sans">(${closed.length})</span></h3>
        ${closed.length ? html`<ul className="list-none p-0 m-0 grid gap-2.5">${closed.map((o) => html`<${OrderRow} key=${o.id} o=${o} />`)}</ul>` : html`<div className="card p-5 text-muted">Nothing here yet.</div>`}</section>
    </div>`;
}

/* ---------- Waste ---------- */
// The ingredient the learning loop opens on: one where the waste feedback visibly changes the order today
// (first the rounded order, then the need before rounding), else the one with the most recent waste
function loopDefault(st) {
  const lines = PRODUCTS.map((p) => { const a = recommendLine(p, st.batches, st.orders, { waste: st.waste }), b = recommendLine(p, st.batches, st.orders, { waste: [] }); return { p, a, b, w: st.waste.filter((x) => x.p === p.id && x.dOff >= -14).reduce((s, x) => s + wasteEur(x), 0) }; });
  const seen = lines.filter((x) => x.a.wasteCut > 0); // the trimmed buffer shows as at least 0.1 of the unit
  const byRec = seen.filter((x) => x.a.rec !== x.b.rec).sort((x, y) => y.w - x.w)[0];
  const byNet = seen.filter((x) => Math.abs(x.a.net - x.b.net) > 0.05).sort((x, y) => Math.abs(y.a.net - y.b.net) * y.p.price - Math.abs(x.a.net - x.b.net) * x.p.price)[0];
  return (byRec || byNet || lines.sort((x, y) => y.w - x.w)[0]).p.id;
}
function WasteScreen() {
  const S = useStore(), nav = useNav();
  const [cat, setCat] = useState("all");

/* =====================================================================
   AI BUDDY: rule-based, answers from the same engine, suggests actions
   ===================================================================== */
const PRODUCT_WORDS = { tomatoes: /tomato/, seabass: /sea ?bass|\bfish\b/, salmon: /salmon/, chicken: /chicken/, mince: /mince|beef/, eggs: /\begg/, milk: /\bmilk/, cream: /cream/, butter: /butter/, cheese: /cheese/, salad: /salad|lettuce/, potatoes: /potato/, veg: /veg(etable)?s?\b/, herbs: /herb|basil/, berries: /berr/, bread: /\bbread/, dough: /dough|croissant|pastr/, pasta: /pasta/, rice: /\brice/, flour: /flour/, oil: /\boil\b/, beer: /\bbeer/, wine: /\bwine/, soft: /soft drink|soda|\bsoft\b/, juice: /juice/, bacon: /bacon/, ham: /\bham\b/, yoghurt: /yogh?urt/, coffee: /coffee/ };
const DOW_WORDS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
function findProduct(t) { for (const [id, re] of Object.entries(PRODUCT_WORDS)) if (re.test(t)) return PBY[id]; return null; }
function dayFromText(t, dflt = 1) {
  if (/today|tonight/.test(t)) return 0;
  if (/tomorrow/.test(t)) return 1;
  for (let i = 0; i < DOW_WORDS.length; i++) if (t.includes(DOW_WORDS[i]) || t.includes(DOW_WORDS[i].slice(0, 3) + " ") || t.endsWith(DOW_WORDS[i].slice(0, 3))) { for (let k = 0; k < 7; k++) if (addDays(TODAY, k).getDay() === i) return k; }
  if (/weekend/.test(t)) { for (let k = 0; k < 7; k++) if (addDays(TODAY, k).getDay() === 6) return k; }
  return dflt;
}
function mealFromText(t, dflt = "dinner") {
  if (/breakfast/.test(t)) return "breakfast";
  if (/lunch/.test(t)) return "lunch";
  if (/dinner|supper|evening/.test(t)) return "dinner";
  if (/\bbar\b|drinks/.test(t)) return "bar";
  return dflt;
}
function buddyPrompts(S) {
  const tom = S.suggested.flatMap((o) => o.lines).find((l) => l.p === "tomatoes");
  const g = GROUPS.find((x) => off(x.arrive) >= 0 && off(x.arrive) <= 6);
  const ge = g && g.extras.find((x) => x.meal === "dinner");
  const fri = dayFromText("friday");
  return [
    "What should I order today?",
    tom ? `Why order ${fmtQty(PBY.tomatoes, tom.qty)} of tomatoes?` : "Why order tomatoes?",
    "What should I prepare tomorrow?",
    `Why is ${dowName(addDays(TODAY, fri))} unusual?`,
    "What could go to waste?",
    "What changed since yesterday?",
    ge ? `What if the wedding grows from ${ge.covers} to ${ge.covers + 11}?` : "What if 10 more guests come on Saturday?",
    `Do I have enough staff on ${dowName(addDays(TODAY, fri))}?`,
    "How do I get my own data into DemandInn?",
    "How accurate is the forecast?",
    "What will the morning email say?",
    "What is the weather doing to tomorrow's covers?",
  ];
}

function answerFor(raw, S, nav) {
  const t = raw.toLowerCase();
  const wedding = GROUPS.find((x) => off(x.arrive) >= 0 && off(x.arrive) <= 7);
  // 1. what-if
  if (/what if|suppose|grows?|\bextra\b|more guests|add \d+|\+\s?\d+/.test(t) && /(\d+)/.test(t)) {
    const nums = (t.match(/\d+/g) || []).map(Number);
    let extra = 10, dOff, meal = "dinner";
    const ge = wedding && wedding.extras.find((x) => x.meal === "dinner");
    if (/(\d+)\s*(to|->|→|up to)\s*(\d+)/.test(t) && nums.length >= 2) extra = nums[1] - nums[0];
    else extra = nums[0];
    if (/wedding|group/.test(t) && ge) dOff = off(ge.date);
    else dOff = dayFromText(t, ge ? off(ge.date) : 2);
    meal = mealFromText(t, "dinner");
    extra = clamp(extra, 1, 60);
    const d = addDays(TODAY, dOff);
    const sc = scenario(d, meal, { extraCovers: extra });
    const diffs = PRODUCTS.map((p) => ({ p, dv: (sc.ingNew.byIng[p.id] || { p50: 0 }).p50 - (sc.ingBase.byIng[p.id] || { p50: 0 }).p50 })).filter((x) => x.dv > 0.05).sort((a, b) => b.dv * b.p.price - a.dv * a.p.price).slice(0, 4);
    return {
      title: `${extra} more ${meal} covers on ${dowName(d)}`,
      lines: [`${cap(meal)} goes from ${sc.base.meals[meal].covers} to ${sc.base.meals[meal].covers + extra} covers.`, diffs.length ? "Ingredients that rise: " + diffs.map((x) => `${x.p.name.toLowerCase()} +${fq(x.p, x.dv)} ${x.p.unit}`).join(", ") + "." : "Ingredients barely change.", "Nothing is saved. If the booking really changes, the forecast and the purchase orders update on their own."],
      actions: [{ label: "View affected dishes", run: () => nav.go("menu", { dateOff: dOff }) }, { label: "Open the what-if on Demand", run: () => nav.go("demand", { dateOff: dOff, tab: "covers" }) }, { label: "Open purchasing", run: () => nav.go("purchasing") }],
    };
  }
  // 1b. data import, email, accuracy, dishes, weather
  if (/\b(csv|upload|import|own data|my data|api|connector|connect|booking\.com|pms|channel manager|integration|excel)\b/.test(t)) {
    return {
      title: "How your data gets in",
      lines: ["Today: upload a CSV export of covers served (and bookings from your PMS). The forecast learns a level for each weekday from it.", "Later, after a pilot: a read-only API key from your PMS, channel manager or till supplier, pasted into DemandInn.", "We never connect to Booking.com or similar sites directly. Bookings arrive through your own systems, with your consent."],
      actions: [{ label: "Open Use your own data", run: () => nav.go("data") }],
    };
  }
  if (/\b(e-?mail|digest|inbox)\b/.test(t)) {
    const tips = morningTips(S);
    return {
      title: `Tomorrow morning's email: ${tips.length} tips`,
      lines: tips.map((x, i) => `${i + 1}. ${x.title}`),
      actions: [{ label: "Preview the email", run: () => nav.go("email") }],
    };
  }
  if (/accura|backtest|wape|proof|pilot|how good|reliable/.test(t) && !/what if/.test(t)) {
    const rs = backtest(28), wM = wape(rs, "manager"), wD = wape(rs, "model");
    return {
      title: `Simulated demo: ${Math.round(((wM - wD) / wM) * 100)}% lower error than "same as last week"`,
      lines: [`Over the last 28 days the forecast was off by ${NUMBER_FMT(wD, 1)}% of covers, against ${NUMBER_FMT(wM, 1)}% for repeating last week.`, "This is simulated demo history, so it shows how the test works and is not a result. A free backtest on your own data gives the real number.", "Pilot target: at least 15% lower error before you switch it on."],
      actions: [{ label: "Open Accuracy", run: () => nav.go("accuracy") }],
    };
  }
  if (/weather|rain|sunny|sun\b|temperature|forecast say/.test(t)) {
    const dOff = dayFromText(t, 1), d = addDays(TODAY, dOff), f = fcDay(d);
    const w = explainDay(f).find((x) => x.key === "weather");
    return {
      title: `${dowName(d)}: weather and covers`,
      lines: [w ? `${w.text}${w.effect ? " " + w.effect + "." : ""}` : "No weather effect on that day.", `Expected ${f.meals.lunch.covers} lunch and ${f.meals.dinner.covers} dinner covers.`],
      actions: [{ label: "Open the day forecast", run: () => nav.openPanel("day", dOff) }],

  }
  if (/(best|top|most|popular).*(dish|sell)|which dish|popular dish/.test(t) && !/ingredient/.test(t)) {
    const dOff = dayFromText(t, 1), d = addDays(TODAY, dOff), ing = ingDay(d), m = mealFromText(t, "dinner");

  // 2. why / how much of a product

      `Peak day is ${dowName(ex.peak.date)} with ${ex.peak.f.meals.dinner.covers} dinner covers${ex.peak.f.events[0] ? " (" + ex.peak.f.events[0].name.split(" at ")[0].toLowerCase() + ")" : ""}.`,
    ];

      title: `${dowName(d)} ${m}: ${f.meals[m].covers} covers (likely ${f.meals[m].p10}–${f.meals[m].p90})`,
      lines: [`A normal ${dowName(d)} ${m} is about ${Math.round(baseline(f.dow, m))} covers, so this is ${vn >= 0 ? "+" : "−"}${Math.round(Math.abs(vn) * 100)}%.`, ...drivers.slice(0, 4).map((x) => `${x.title}: ${x.text} ${x.effect}.`)],

    const m = mealFromText(t, "dinner");
    const dishes = Object.entries(ing.menus[m].dishes).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const top = prepList(d);
    const c = ing.menus[m].constraints;
    return {
      title: `${dowName(d)} ${m}: ${f.meals[m].covers} covers`,
      lines: [dishes.length ? "Portions: " + dishes.map(([id, n]) => `${n} ${DISHES[id].name.toLowerCase()}`).join(", ") + "." : "Drinks only for the bar.", c ? `Set aside ${c.veg + c.vegan} vegetarian or vegan and ${c.gf} gluten-free portions first.` : "", "Biggest ingredient quantities across the day: " + top.join("; ") + "."].filter(Boolean),
      actions: [{ label: "View affected dishes", run: () => nav.go("menu", { dateOff: dOff }) }, { label: "Open ingredients", run: () => nav.go("demand", { dateOff: dOff, tab: "ingredients" }) }],

  // 5. waste / expiring
  if (/waste|expir|use first|use up|spoil|throw|go off|bin/.test(t)) {
    const uf = S.summary.filter((r) => r.useFirst).slice(0, 3);

    const rr = (wr[0] || uf[0]);
    if (rr) acts.push({ label: `Reduce next ${rr.p.name.toLowerCase()} order`, run: () => { const sl = S.suggested.find((o) => o.sup === rr.p.sup); const line = sl && sl.lines.find((l) => l.p === rr.p.id); if (line) S.override(rr.p.sup, rr.p.id, Math.max(0, line.qty - rr.p.step), "AI Buddy suggestion: reduce waste"); else S.say(`No ${rr.p.name.toLowerCase()} order to reduce. Nothing is suggested for it today.`); } });

      actions: acts,

  }
  // 6. changes
  if (/change|new|since yesterday|update|different/.test(t)) {

    return {
      title: ch.length ? "Changes since yesterday" : "Nothing has moved since yesterday",
      lines: ch.map((c) => `${dowName(c.date)} ${c.meal}: ${c.then} to ${c.now} covers (${c.delta > 0 ? "+" : ""}${c.delta}). ${c.why.join("; ")}.`),
      actions: ch.length ? [{ label: "Open the day forecast", run: () => nav.openPanel("day", ch[0].off) }, { label: "Open purchasing", run: () => nav.go("purchasing") }] : [],

    const tg = teamGaps(S.state.rota);

      title: gaps.length ? `${dowName(d)}: ${gaps.reduce((s, g) => s + g.n, 0)} more ${plural(gaps.reduce((s, g) => s + g.n, 0), "person", "people")} would help` : `${dowName(d)}: your team looks covered`,

  return tips.slice(0, 5);

const SCREENS = [["today", "Today", "home"], ["demand", "Demand", "layers"], ["menu", "Menu", "plate"], ["calendar", "Calendar", "calendar"], ["stock", "Stock", "box"], ["purchasing", "Purchasing", "clipboard"], ["waste", "Waste", "trash"], ["team", "Team", "users"], ["email", "Morning email", "send"], ["accuracy", "Accuracy", "trend"], ["data", "Use your own data", "database"]];
const screenFromHash = () => { const m = /^#\/app\/([a-z]+)/.exec(location.hash); const k = m && m[1]; return SCREENS.some((x) => x[0] === k) ? k : "today"; };

function AppWindow({ initial = "today", id = "app", full = false }) {
  const S = useStore();
  const [screen, setScreen] = useState(full ? screenFromHash() : initial);
  const [intent, setIntent] = useState(null);
  const [nonce, setNonce] = useState(0);
  const [panel, setPanel] = useState(null);
  const [modal, setModal] = useState(null);
  const [chat, setChat] = useState([]);
  const scroller = useRef(null);
  const nav = useMemo(() => ({
    go: (s, i) => { setPanel(null); setModal(null); setIntent(i || null); setScreen(s); setNonce((n) => n + 1); if (scroller.current) scroller.current.scrollTop = 0; if (full) { try { history.replaceState(null, "", "#/app/" + s); } catch (e) {} } },
    openPanel: (type, data) => setPanel({ type, data }),
    openModal: (type, data) => setModal({ type, data }),
  }), []);
  useEffect(() => {
    const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); nav.openPanel("buddy"); } };
    document.addEventListener("keydown", k);
    const hc = () => { if (full && /^#\/app/.test(location.hash)) { setScreen(screenFromHash()); setIntent(null); setNonce((n) => n + 1); } };
    window.addEventListener("hashchange", hc);
    return () => { document.removeEventListener("keydown", k); window.removeEventListener("hashchange", hc); };
  }, []);
  const onKey = (e) => {
    const i = SCREENS.findIndex((x) => x[0] === screen);
    if (["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key)) {
      e.preventDefault();
      const fwd = e.key === "ArrowRight" || e.key === "ArrowDown";
      const n = SCREENS[(i + (fwd ? 1 : SCREENS.length - 1)) % SCREENS.length][0];
      nav.go(n);
      requestAnimationFrame(() => { const el = document.getElementById(`${id}-tab-${n}`); if (el) el.focus(); });
    }
  };
  const closeP = () => setPanel(null), closeM = () => setModal(null);
  const badges = { stock: S.summary.filter((r) => r.useFirst || r.expired.length).length, purchasing: S.suggested.length, team: teamGaps(S.state.rota).gaps.length };
  const panelTitle = panel && { order: "Order", event: "Event details", day: "Day forecast", list: "More orders", explain: "Why this order", buddy: "AI Buddy" }[panel.type];
  return html`
    <${NavCtx.Provider} value=${nav}>
      <div className=${cls("app-window app-shell", full && "app-full")}>
        <aside className="app-side" aria-label=${`${PRODUCT_NAME} navigation`}>
          <div className="app-brand"><span className="mark" aria-hidden="true">D</span><span className="name">${PRODUCT_NAME}</span></div>
          ${full && html`<a href="#top" className="side-back"><${Icon} name="left" size=${16} />Back to the website</a>`}
          <button type="button" className="side-assist" onClick=${() => nav.openPanel("buddy")} aria-label="Open the assistant"><${Icon} name="spark" size=${19} /><span>Assistant</span><kbd>Ctrl K</kbd></button>
          <div role="tablist" aria-orientation="vertical" aria-label="App screens" onKeyDown=${onKey} className="side-nav">
            ${SCREENS.map(([k, l, ic]) => [k === "email" && html`<div key="sep" role="presentation" className="side-sep">Share and prove</div>`, html`
              <button key=${k} id=${`${id}-tab-${k}`} role="tab" type="button" aria-selected=${screen === k} aria-controls=${`${id}-panel`} tabIndex=${screen === k ? 0 : -1}
                onClick=${() => nav.go(k)} className=${cls("side-link", screen === k && "on")}><${Icon} name=${ic} size=${20} /><span>${l}</span>${badges[k] > 0 && html`<span className="badge" aria-label=${`${badges[k]} to look at`}>${badges[k]}</span>`}</button>`])}
          </div>
          <div className="side-hotel"><b>${HOTEL.name}</b><span>${HOTEL.rooms} rooms · restaurant and bar</span><span>${fmtDate(TODAY, { day: "numeric", month: "short" })} · demo data</span></div>
        </aside>
        <div className="app-main">
        <p className="app-note"><${Icon} name="database" size=${15} />${DATA_SOURCE.kind === "csv" ? `Forecast calibrated on your file "${DATA_SOURCE.name}" (${DATA_SOURCE.rows} days). Bookings, stock and orders are still simulated for ${HOTEL.name}.` : `${SIM_NOTE}. Every number is computed live by the forecasting engine. The history is simulated.`} Changes reset when you reload.${DATE_FROM_LINK ? ` Demo date fixed to ${fmtDate(TODAY, { weekday: "short", day: "numeric", month: "short", year: "numeric" })} by the link.` : ""}</p>
        <div id=${`${id}-panel`} role="tabpanel" aria-labelledby=${`${id}-tab-${screen}`} ref=${scroller} tabIndex="0" className="app-body">
          <div key=${nonce}>
            ${screen === "today" && html`<${TodayScreen} />`}
            ${screen === "demand" && html`<${DemandScreen} intent=${intent} />`}
            ${screen === "menu" && html`<${MenuScreen} intent=${intent} />`}
            ${screen === "calendar" && html`<${CalendarScreen} intent=${intent} />`}
            ${screen === "stock" && html`<${StockScreen} intent=${intent} />`}
            ${screen === "purchasing" && html`<${PurchasingScreen} />`}
            ${screen === "waste" && html`<${WasteScreen} />`}
            ${screen === "team" && html`<${TeamScreen} intent=${intent} />`}
            ${screen === "email" && html`<${EmailScreen} />`}
            ${screen === "accuracy" && html`<${AccuracyScreen} />`}
            ${screen === "data" && html`<${DataScreen} />`}
          </div>
        </div>
        </div>
      </div>
      ${panel && html`<${Overlay} kind="panel" title=${panelTitle} onClose=${closeP}>
        ${panel.type === "order" && html`<${OrderPanel} id=${panel.data} onClose=${closeP} />`}
        ${panel.type === "event" && html`<${EventPanel} id=${panel.data} onClose=${closeP} />`}
        ${panel.type === "day" && html`<${DayPanel} dateOff=${panel.data} onClose=${closeP} />`}
        ${panel.type === "list" && html`<${OrderListPanel} ids=${panel.data} />`}
        ${panel.type === "explain" && html`<${ExplainPanel} pid=${panel.data.pid} onClose=${closeP} />`}
        ${panel.type === "buddy" && html`<${BuddyPanel} chat=${chat} setChat=${setChat} onClose=${closeP} />`}
      <//>`}
      ${modal && html`<${Overlay} title=${{ receive: "Receive a delivery", waste: "Log waste", order: modal.data && modal.data.editingId && !modal.data.editingId.startsWith("sug-") ? "Edit order" : "New order" }[modal.type]} onClose=${closeM} wide=${modal.type === "receive"}>
        ${modal.type === "receive" && html`<${ReceiveForm} orderId=${modal.data && modal.data.orderId} onClose=${closeM} />`}
        ${modal.type === "waste" && html`<${WasteForm} productId=${modal.data && modal.data.productId} onClose=${closeM} />`}
        ${modal.type === "order" && html`<${OrderForm} editingId=${modal.data && modal.data.editingId} onClose=${closeM} />`}
      <//>`}
      ${S.toast && html`<div role="status" aria-live="polite" className="toast"><${Icon} name="check" size=${18} />${S.toast.msg}</div>`}
    <//>`;
}

function HeroCard() {
  const S = useStore();
  const d = addDays(TODAY, 1), f = fcDay(d), bf = f.meals.dinner, fb = f.meals.breakfast, fl = f.meals.lunch;
  // The next order to decide (earliest deadline), with the same figures as Purchasing and the Explain panel
  const [done, setDone] = useState(null);
  const nxt = done || S.suggested.slice().sort((a, b) => a.deadlineOff - b.deadlineOff || a.etaOff - b.etaOff)[0];
  const rows = nxt ? nxt.lines.map((l) => ({ l, L: nxt.details[l.p] })).sort((a, b) => b.l.qty * PBY[b.l.p].price - a.l.qty * PBY[a.l.p].price).slice(0, 3) : [];
  const approved = !!done;
  const dday = nxt ? addDays(TODAY, nxt.etaOff) : null;
  return html`
    <div className="docket" aria-label="Live example from the demo">
      <div className="flex items-start justify-between gap-3"><p className="mono">Kitchen order · ${HOTEL.name}</p><p className="mono">${dowShort(d)} ${fmtDate(d, { day: "numeric", month: "short" })}</p></div>
      <div className="docket-body">

          </table>

      ${nxt && html`<p className="m-0 mt-2 text-[12.5px] text-muted">${SUPPLIERS[nxt.sup].name}, delivery ${dowShort(dday)}. Need is the forecast until the next delivery. The order adds a safety buffer and rounds up to the case size.</p>`}

    </div>`;

// The deck's ROI model (7 Oct deck), so the site and the deck give the same answer.
// Defaults: the 28-room demo hotel. Food waste share: Winnow puts it at 5 to 15% of food bought.
const PRICE_MONTH = 149;
const ROI_DEFAULTS = { rooms: HOTEL.rooms, occ: 75, gpr: 1.6, uptake: 85, costCover: 4, wastePct: 12, cut: 30, minutes: 30, rate: 25 };
function roiModel(v) {
  const coversYear = v.rooms * (v.occ / 100) * v.gpr * (v.uptake / 100) * 365;
  const foodYear = coversYear * v.costCover;
  const wasteYear = foodYear * (v.wastePct / 100);
  const foodSaved = wasteYear * (v.cut / 100);
  const timeSaved = (v.minutes / 60) * v.rate * 365;
  const priceYear = PRICE_MONTH * 12;
  return { coversYear, foodYear, wasteYear, foodSaved, timeSaved, total: foodSaved + timeSaved, priceYear, multiple: (foodSaved + timeSaved) / priceYear };
}
function RoiCalculator() {
  const [v, setV] = useState(ROI_DEFAULTS);
  const r = roiModel(v);
  const set = (k) => (e) => setV((x) => ({ ...x, [k]: Number(e.target.value) }));
  const slider = (k, label, shown, min, max, step) => html`<label key=${k} className="block"><span className="flex justify-between gap-3 text-[16px] mb-1.5"><span>${label}</span><b className="tnum whitespace-nowrap">${shown}</b></span><input id=${"roi-" + k} type="range" min=${min} max=${max} step=${step} value=${v[k]} onInput=${set(k)} className="w-full accent-[#dfa550]" /></label>`;
  return html`
    <section id="roi" className="py-16 md:py-20 dk2">
      <${Wrap}>
        <${SectionHead} dark=${true} title="What could it be worth to you?" intro="A simple what-if with your own numbers. These are assumptions you set, not results we have measured." />
        <div className="grid lg:grid-cols-[1.2fr_1fr] gap-5 items-stretch">
          <div className="rounded-[16px] bg-[#1f352d] border border-white/10 p-6 grid gap-5">
            <p className="m-0 text-[13px] font-bold tracking-wider uppercase muted">Your hotel</p>
            ${slider("rooms", "Rooms", v.rooms, 10, 120, 1)}
            ${slider("occ", "Average occupancy", v.occ + "%", 30, 100, 1)}
            ${slider("gpr", "Guests per occupied room", NUMBER_FMT(v.gpr, 1), 1, 2.5, 0.1)}
            ${slider("uptake", "Guests who eat breakfast", v.uptake + "%", 30, 100, 1)}
            ${slider("costCover", "Food cost per breakfast cover", "EUR " + NUMBER_FMT(v.costCover, 2), 1, 10, 0.25)}
            <p className="m-0 mt-2 text-[13px] font-bold tracking-wider uppercase muted">Assumptions</p>
            ${slider("wastePct", "Share of food wasted today (typical range 5 to 15%)", v.wastePct + "%", 3, 25, 1)}
            ${slider("cut", "Assumed reduction in that waste", v.cut + "%", 0, 50, 1)}
            ${slider("minutes", "Manager time saved per day", v.minutes + " min", 0, 90, 5)}
            ${slider("rate", "Cost of that time per hour", "EUR " + v.rate, 10, 50, 1)}
          </div>
          <div className="rounded-[16px] bg-amber text-forest p-6 flex flex-col justify-center">
            <p className="m-0 text-[14px] font-bold tracking-wider uppercase">Hypothetical value per year</p>
            <p className="font-serif text-[56px] leading-none my-3 tnum" aria-live="polite">EUR ${NUMBER_FMT(Math.round(r.total))}</p>
            <p className="m-0 text-[16px] tnum">EUR ${NUMBER_FMT(Math.round(r.foodSaved))} of food no longer thrown away, plus EUR ${NUMBER_FMT(Math.round(r.timeSaved))} of manager time.</p>
            <p className="m-0 mt-3 text-[16px] tnum">Against EUR ${NUMBER_FMT(r.priceYear)} a year for ${PRODUCT_NAME} (EUR ${PRICE_MONTH} × 12), that is about <b>${NUMBER_FMT(r.multiple, 1)}×</b> what it costs.</p>
            <p className="m-0 mt-3 text-[14.5px]">Arithmetic on your inputs: rooms × occupancy × guests per room × breakfast uptake × 365 gives the covers; covers × food cost × waste share × reduction gives the food saved. It is not a promise.</p>
          </div>
        </div>
      <//>
    </section>`;
}

            ${st.done === "sent" ? html`<div role="status" className="rounded-xl bg-ok-tint text-ok-ink p-4 flex gap-3 items-center"><${Icon} name="checkcircle" size=${24} />Thanks, we'll email you within two working days to set up the backtest.</div>`
              : st.done === "mailto" ? html`<div role="status" className="rounded-xl bg-ok-tint text-ok-ink p-4 grid gap-2"><span className="flex gap-3 items-center"><${Icon} name="checkcircle" size=${24} />Your mail app should open with a message to ${CONTACT_EMAIL}. Send it, and we'll email you within two working days to set up the backtest.</span><span className="text-[14.5px]">Nothing opened? Write to <a href=${"mailto:" + CONTACT_EMAIL} style=${{ textDecoration: "underline" }}>${CONTACT_EMAIL}</a>.</span></div>`
              : html`<form onSubmit=${submit} noValidate className="grid gap-3">
              <label className="sr-only" for="cta-email">Work email</label>
              <input id="cta-email" name="email" type="email" autoComplete="email" placeholder="you@yourhotel.com" value=${email} onInput=${(e) => setEmail(e.target.value)} aria-invalid=${!!st.err} className="field !min-h-[52px]" disabled=${st.done === "sending"} />
              <input type="hidden" name="source" value="demandinn-site" />
              <button type="submit" className="btn btn-dark btn-lg" disabled=${st.done === "sending"} aria-busy=${st.done === "sending"}>${st.done === "sending" ? "Sending…" : "Become a pilot hotel"}</button></form>`}
            <p role="alert" className="min-h-[24px] mt-3 mb-0 text-[15px] text-urgent font-medium">${st.err}</p>
          </div>
        </div>
      <//>
    </section>`;
}

const FAQ_ITEMS = [
  ["Do I have to replace my systems?", "No. It works alongside your booking and till systems. You upload exports from them (or, later, add a read-only API key), and nothing needs to be switched off."],
  ["What data do I need?", "Reservations with board type, till sales by item (a year is ideal), your recipes and your supplier list. If you only have part of this, we start with what you have."],
  ["How accurate is it?", "Forecasts are estimates, not promises. Each one comes with a likely range, and each number can be traced back to its inputs. The figures in this demo are simulated. Real accuracy figures will come from pilots."],
  ["What about guests with allergies or dietary needs?", "Vegetarian, vegan and gluten-free guests are treated as hard constraints: they are given a suitable dish before the rest of the menu is shared out. The forecast does not replace your allergen procedures."],
  ["Does it handle weddings and groups?", "Yes. A group is an explicit input, with its covers, time, dietary needs and set menu, added on top of the normal forecast."],
  ["What if the forecast is wrong?", "You change the quantity and give a reason. Both are kept, and the change feeds into the next order."],
  ["Is my data safe? What about GDPR?", "For pilots, we collect only what the forecast needs: booking and cover counts, sales by item, recipes and stock. Guest names are not needed. The data is stored in the EU, never sold, and deleted when you ask."],
  ["Is it only for breakfast?", "No. The same bookings drive breakfast, lunch, dinner and the bar. Covers are forecast per service, and dishes, ingredients and orders follow from them. Breakfast-only hotels benefit too, because board type and who is staying carry most of that forecast."],
  ["Do you connect to Booking.com or my other apps?", "Not directly. Bookings and sales reach DemandInn through your own systems. Today you upload a CSV export from your PMS and till. After a pilot, a read-only API key from your PMS, channel manager or till supplier can feed it nightly. You can try the import in the demo."],
];

function useHash() {
  const [h, setH] = useState(location.hash);
  useEffect(() => { const f = () => setH(location.hash); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  return h;
}
function App() {
  const hash = useHash();

  useEffect(() => { window.scrollTo(0, 0); document.title = inApp ? `${PRODUCT_NAME} demo: ${HOTEL.name}` : `${PRODUCT_NAME}: ${BRAND_LINE}`; }, [inApp]);
  return html`
    <${StoreProvider}>
